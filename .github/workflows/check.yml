name: Site Check

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self-test the check
        run: node scripts/check-site.mjs --selftest
      - name: Validate catalog, JS syntax, links, ES5, paths, CDNs and docs
        run: node scripts/check-site.mjs
      - name: Run unit tests (tests/*.test.js)
        run: |
          for t in tests/*.test.js; do
            echo "== $t"
            node "$t" || exit 1
          done
