<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem}
h1{font-size:1.5rem;opacity:.7}
.preview{width:200px;height:200px;border-radius:16px;border:3px solid #333}
input[type=color]{width:200px;height:50px;border:none;border-radius:8px;cursor:pointer;background:none}
.values{display:grid;grid-template-columns:80px 1fr 40px;gap:.5rem;align-items:center;width:320px}
label{font-weight:600;opacity:.7}
.val{background:#111;border:1px solid #333;border-radius:6px;padding:.5rem;color:#fff;font-family:monospace;font-size:.95rem;text-align:center}
.copy-btn{background:#2979ff;color:#fff;border:none;border-radius:6px;padding:.4rem;cursor:pointer;font-size:.75rem}
button.save{background:#00c853;color:#000;border:none;border-radius:8px;padding:.6rem 1.5rem;cursor:pointer;font-weight:600}
h2{font-size:1.1rem;opacity:.5;margin-top:1rem}
.saved{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.swatch{width:40px;height:40px;border-radius:8px;border:2px solid #333;cursor:pointer;transition:transform .1s}
.swatch:hover{transform:scale(1.15)}
</style>
</head>
<body>
<h1>Color Picker</h1>
<div class="preview" id="preview"></div>
<input type="color" id="picker" value="#2979ff">
<div class="values">
<label>HEX</label><div class="val" id="hex">#2979FF</div><button class="copy-btn" onclick="copy('hex')">Copy</button>
<label>RGB</label><div class="val" id="rgb">rgb(41, 121, 255)</div><button class="copy-btn" onclick="copy('rgb')">Copy</button>
<label>HSL</label><div class="val" id="hsl">hsl(217, 100%, 58%)</div><button class="copy-btn" onclick="copy('hsl')">Copy</button>
</div>
<button class="save" onclick="saveColor()">Save to Palette</button>
<h2>Saved Palette</h2>
<div class="saved" id="saved"></div>
<script>
var picker=document.getElementById("picker");var saved=[];
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0;}else{var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};}
function update(){var hex=picker.value.toUpperCase();var rgb=hexToRgb(hex);var hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);document.getElementById("preview").style.background=hex;document.getElementById("hex").textContent=hex;document.getElementById("rgb").textContent="rgb("+rgb.r+", "+rgb.g+", "+rgb.b+")";document.getElementById("hsl").textContent="hsl("+hsl.h+", "+hsl.s+"%, "+hsl.l+"%)";}
function copy(id){navigator.clipboard.writeText(document.getElementById(id).textContent);}
function saveColor(){var c=picker.value;if(saved.indexOf(c)===-1){saved.push(c);var el=document.createElement("div");el.className="swatch";el.style.background=c;el.title=c;el.onclick=function(){picker.value=c;update();};document.getElementById("saved").appendChild(el);}}
picker.addEventListener("input",update);update();
</script>
</body>
</html>
