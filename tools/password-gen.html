<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem}
h1{font-size:1.5rem;opacity:.7}
.output{font-family:monospace;font-size:1.8rem;background:#111;border:2px solid #333;border-radius:10px;padding:1rem 1.5rem;min-width:320px;text-align:center;word-break:break-all;letter-spacing:1px;user-select:all}
.strength{height:6px;border-radius:3px;width:320px;background:#222;overflow:hidden}
.strength-bar{height:100%;transition:width .3s,background .3s;border-radius:3px}
.controls{display:flex;flex-direction:column;gap:.75rem;width:320px}
.row{display:flex;justify-content:space-between;align-items:center}
input[type=range]{flex:1;margin:0 .75rem}
.len-val{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.toggle{position:relative;width:44px;height:24px;background:#333;border-radius:12px;cursor:pointer;border:none}
.toggle.on{background:#00c853}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.buttons{display:flex;gap:1rem}
button.gen{background:#2979ff;color:#fff;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1.1rem;cursor:pointer;font-weight:600}
button.copy{background:#00c853;color:#000;border:none;border-radius:8px;padding:.75rem 2rem;font-size:1.1rem;cursor:pointer;font-weight:600}
</style>
</head>
<body>
<h1>Password Generator</h1>
<div class="output" id="pw">click Generate</div>
<div class="strength"><div class="strength-bar" id="bar"></div></div>
<div class="controls">
<div class="row"><label>Length</label><input type="range" id="len" min="4" max="64" value="16"><span class="len-val" id="lenVal">16</span></div>
<div class="row"><label>Uppercase</label><button class="toggle on" id="upper" onclick="tog(this)"></button></div>
<div class="row"><label>Lowercase</label><button class="toggle on" id="lower" onclick="tog(this)"></button></div>
<div class="row"><label>Numbers</label><button class="toggle on" id="nums" onclick="tog(this)"></button></div>
<div class="row"><label>Symbols</label><button class="toggle on" id="syms" onclick="tog(this)"></button></div>
</div>
<div class="buttons">
<button class="gen" onclick="generate()">Generate</button>
<button class="copy" onclick="copyPw()">Copy</button>
</div>
<script>
var U="ABCDEFGHIJKLMNOPQRSTUVWXYZ",L="abcdefghijklmnopqrstuvwxyz",N="0123456789",S="!@#$%^&*()_+-=[]{}|;:,.<>?";
function tog(el){el.classList.toggle("on");}
function isOn(id){return document.getElementById(id).classList.contains("on");}
document.getElementById("len").oninput=function(){document.getElementById("lenVal").textContent=this.value;};
function generate(){var chars="";if(isOn("upper"))chars+=U;if(isOn("lower"))chars+=L;if(isOn("nums"))chars+=N;if(isOn("syms"))chars+=S;if(!chars){alert("Enable at least one set!");return;}var len=parseInt(document.getElementById("len").value);var pw="";var arr=new Uint32Array(len);crypto.getRandomValues(arr);for(var i=0;i<len;i++)pw+=chars[arr[i]%chars.length];document.getElementById("pw").textContent=pw;var score=0;if(pw.length>=8)score++;if(pw.length>=16)score++;if(pw.length>=24)score++;if(/[A-Z]/.test(pw))score++;if(/[a-z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;var pct=Math.round(score/7*100);var bar=document.getElementById("bar");bar.style.width=pct+"%";bar.style.background=pct<40?"#ff1744":pct<70?"#ffc107":"#00c853";}
function copyPw(){navigator.clipboard.writeText(document.getElementById("pw").textContent);}
</script>
</body>
</html>
