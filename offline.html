<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | F.O.N.G. Arcade</title>
    <style>
        html, body { margin: 0; min-height: 100%; background: #0f1117; color: #f4f6fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; text-align: center; }
        main { max-width: 420px; }
        .big { font-size: 3.5rem; margin: 0 0 8px; }
        h1 { font-size: 1.6rem; margin: 0 0 10px; }
        p { color: #b9c0d4; line-height: 1.5; margin: 0 0 22px; }
        a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 22px; margin: 4px; border-radius: 22px; border: 2px solid #00e5ff; background: transparent; color: #00e5ff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
        a.primary { background: #00e5ff; color: #0f1117; }
    </style>
</head>
<body>
    <main>
        <p class="big" aria-hidden="true">&#127918;</p>
        <h1>You're offline.</h1>
        <p>Games you've played before still work.</p>
        <a class="primary" href="./index.html">Go to the arcade</a>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
