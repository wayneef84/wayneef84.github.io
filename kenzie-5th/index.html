<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kenzie's 5th Birthday</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",system-ui,sans-serif;background:#ffd6ec;position:fixed;top:0;right:0;bottom:0;left:0;width:100%}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;touch-action:none}
svg{display:block;overflow:visible}
.hide{display:none!important}
#app{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(160deg,#ffc1e3,#e3c8ff 50%,#bfe6ff);overflow:hidden}
#cv{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
#fx{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:45;overflow:hidden}
.fxi{position:absolute;top:0;right:0;bottom:0;left:0}
#share{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 100px);right:20px;width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid #b388ff;box-shadow:0 4px 0 #8a5fd6;z-index:70;display:flex;align-items:center;justify-content:center;padding:0}
#share svg{display:block}
#qrm{position:fixed;top:0;right:0;bottom:0;left:0;z-index:200;background:rgba(43,27,58,.72);display:none;align-items:center;justify-content:center}
#qrm.show{display:flex}
#qrm .card{background:#fff;border-radius:28px;border:6px solid #b388ff;padding:22px 26px 20px;text-align:center;max-width:86vw;max-height:92vh;font-family:inherit;color:#4a2b8a}
#qrm .qrbox{width:min(62vmin,420px);height:min(62vmin,420px);margin:0 auto}
#qrm .qrbox svg{display:block;width:100%;height:100%}
#qrm h3{margin:0 0 10px;font-size:26px}
#qrm .url{margin-top:10px;font-size:15px;word-break:break-all;opacity:.8}
#qrx{margin-top:14px;min-width:88px;height:64px;border-radius:32px;border:5px solid #d6b8ff;background:#7b4bd1;color:#fff;font-size:26px;box-shadow:0 5px 0 #4a2b8a;padding:0 26px}
#mute{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;width:88px;height:88px;border-radius:50%;background:#fff;font-size:42px;z-index:70;box-shadow:0 4px 0 #e08ac0;border:5px solid #ff6fb5}
/* ---------- caption bubble ---------- */
#bubble{position:fixed;left:50%;top:8px;transform:translate(-50%,-30px) scale(.92);width:min(calc(100vw - 240px),800px);padding:10px 16px;background:rgba(255,255,255,.7);border:6px solid rgba(255,111,181,.85);border-radius:34px;display:flex;align-items:center;gap:12px;z-index:60;opacity:0;pointer-events:none;transition:transform .25s,opacity .25s}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#bubble .av{flex:0 0 clamp(70px,12vmin,104px);width:clamp(70px,12vmin,104px);height:clamp(70px,12vmin,104px);overflow:hidden}
#bav svg{width:100%;height:100%}
#bubble .tx{flex:1;font-size:clamp(24px,4.6vmin,44px);font-weight:900;line-height:1.25;color:#8b4fd6}
#bubble .w{display:inline-block;padding:0 .08em;border-radius:.3em;transition:transform .15s,background .15s,color .15s}
#bubble .w.done{color:#c07ae8;text-shadow:0 0 8px #ffe9a0}
#bubble .w.on{background:#fff3a0;color:#d6246e;transform:scale(1.18);text-shadow:0 0 14px #ffe14d,0 0 26px #ff8fc7;animation:wglow .8s ease-in-out infinite alternate}
@keyframes wglow{to{text-shadow:0 0 24px #ffd000,0 0 40px #ff6fb5}}
#again{display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 88px;width:88px;height:88px;border-radius:50%;background:#7b4bd1;color:#fff;font-size:44px;border:5px solid #d6b8ff;box-shadow:0 5px 0 #4a2b8a;pointer-events:auto}
#bubble:not(.show) #again{pointer-events:none}
#again svg{display:block;margin:0}
#bubble.show .av{pointer-events:auto}
/* ---------- cover ---------- */
#cover{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;perspective:1800px;z-index:20}
#cover.gone{display:none}
.cbook{position:relative;width:min(78vmin,640px);height:min(90vmin,740px);transform-style:preserve-3d;margin-top:-2vmin}
.cbook.opening{animation:bookopen 1.6s ease-in forwards}
@keyframes bookopen{0%{transform:scale(1)}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1.2);opacity:0}}
.cpages{position:absolute;top:6px;right:0;bottom:6px;left:10px;background:repeating-linear-gradient(#fff 0 6px,#e9dff5 6px 8px);border-radius:8px 20px 20px 8px;transform:translateX(10px)}
.cfront{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:0 50%;transform-style:preserve-3d}
.cface,.cback{position:absolute;top:0;right:0;bottom:0;left:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px 26px 26px 12px;border:10px solid #ff6fb5;overflow:hidden}
.cback{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#ffd1ea 0 14px,#ffe7f4 14px 28px)}
.cface{background:linear-gradient(135deg,#ff9ad0,#ffd1a6 24%,#fff3a0 38%,#b6f2c0 52%,#a9dcff 66%,#d2b4ff 82%,#ff9ad0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;box-shadow:0 10px 0 #c04a92}
.cbook.opening #clasp,.cbook.opening .tapword{animation:fadeo .3s forwards}
.cbook.opening .cfront{animation:coverswing 1.3s cubic-bezier(.5,0,.3,1) forwards}
@keyframes coverswing{0%{transform:rotateY(0)}14%{transform:rotateY(7deg)}100%{transform:rotateY(-172deg)}}
.cface::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,#d1478f,#ff8fc7)}
.shim{position:absolute;top:-10%;bottom:-10%;left:0;width:40%;background:linear-gradient(100deg,transparent,#ffffffb0,transparent);transform:translateX(-150%) skewX(-18deg);animation:shim 3.6s ease-in-out infinite}
@keyframes shim{0%{transform:translateX(-150%) skewX(-18deg)}60%,100%{transform:translateX(450%) skewX(-18deg)}}
.cfront i{position:absolute;font-style:normal;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{50%{transform:scale(1.5) rotate(20deg);opacity:.25}}
.ctitle{position:relative;margin:0;text-align:center;font-size:min(8.4vmin,64px);line-height:1.05;font-weight:900;color:#fff;-webkit-text-stroke:2px #d6246e;paint-order:stroke fill;text-shadow:0 4px 0 #d6246e}
.ctitle b{display:block;font-size:min(18vmin,138px);color:#fff6a8}
.cuni{width:min(32vmin,240px);position:relative;animation:leapy 2.6s ease-in-out infinite}
@keyframes leapy{50%{transform:translateY(-12px) rotate(3deg)}}
#clasp{position:absolute;right:-10px;top:50%;width:112px;height:112px;margin-top:-56px;z-index:5;border-radius:50%;background:radial-gradient(#fff3a0,#ffc531);border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:56px;animation:claspp 1.3s ease-in-out infinite}
@keyframes claspp{0%,100%{transform:scale(1)}40%{transform:scale(1.14,.9)}70%{transform:scale(.94,1.1)}}
.tapword{position:absolute;right:0;top:calc(50% + 62px);width:130px;text-align:center;font-weight:900;font-size:26px;color:#fff;-webkit-text-stroke:1.5px #d6246e;paint-order:stroke fill;z-index:5;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
#scwrap{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:10px;z-index:30}
#sc{width:96px;height:96px;border-radius:50%;background:#fff;border:6px solid #7b4bd1;font-size:44px;box-shadow:0 5px 0 #4a2b8a}
#sc.first{animation:claspp 1.3s ease-in-out infinite}
#sctxt{font-size:22px;font-weight:900;color:#5b2d9e;background:#fffc;border-radius:16px;padding:4px 12px;max-width:40vw}
/* ---------- book shell ---------- */
#bookwrap{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0}
#bookwrap.on{opacity:1;transition:opacity .6s}
#book{position:absolute;left:22px;right:22px;top:max(6px,env(safe-area-inset-top));bottom:calc(98px + env(safe-area-inset-bottom));perspective:1500px;border-radius:24px;border:8px solid #fff;background:#fff;box-shadow:0 6px 0 #c9a6e0,5px 0 0 #f4eefb,8px 0 0 #dccdee,11px 0 0 #f4eefb,14px 0 0 #dccdee,-5px 0 0 #f4eefb,-8px 0 0 #dccdee,-11px 0 0 #f4eefb,-14px 0 0 #dccdee}
.spread{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;border-radius:16px;z-index:1;backface-visibility:hidden}
.spread::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(90deg,#ffffff26 0,#ffffff26 calc(50% - 70px),#ff8fc714 calc(50% + 70px),#ff8fc714 100%)}
.spread::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:3;background:linear-gradient(90deg,#0000 0,#0000 26%,#0000000b 40%,#00000022 50%,#0000000b 60%,#0000 74%,#0000 100%)}
@media (orientation:portrait){.spread::before{background:linear-gradient(180deg,#ffffff26 0,#ffffff26 calc(50% - 70px),#ff8fc714 calc(50% + 70px),#ff8fc714 100%)}.spread::after{background:linear-gradient(180deg,#0000 0,#0000 26%,#0000000b 40%,#00000022 50%,#0000000b 60%,#0000 74%,#0000 100%)}}
.sp0{background:linear-gradient(160deg,#ffc1e3,#e3c8ff 50%,#bfe6ff)}
.sp1{background:linear-gradient(#8fd3ff,#d7f0ff 58%,#9be58b)}
.sp2{background:linear-gradient(#ffd0ea,#e8c9ff 60%,#ffb6d9)}
.sp3{background:linear-gradient(#ffe0f0,#d9d0ff 50%,#b9f0d0)}
.sp4{background:radial-gradient(circle at 50% 0,#6b2fb5,#2a1054 75%)}
.sp5{background:linear-gradient(135deg,#ff3fa4,#ff9a2e 60%,#ffe14d)}
.sp6{background:linear-gradient(#c9f0ff,#e6d4ff 60%,#ffd9ec)}
.sp7{background:linear-gradient(#ffd0ea,#c9e4ff)}
.sp8{background:linear-gradient(#7b4bd1,#ff6fb5 60%,#ffd1a6)}
.deco,.amb,.play,.chars{position:absolute}
.deco,.amb{top:0;right:0;bottom:0;left:0;pointer-events:none}
.play{top:0;right:0;bottom:0;left:0;z-index:5;pointer-events:none}
.chars{left:0;right:0;bottom:0;display:flex;align-items:flex-end;padding:0 0 4px;z-index:4;pointer-events:none}
.cg{flex:1;display:flex;justify-content:space-around;align-items:flex-end;padding:0 28px 0 112px}
.cg+.cg{padding:0 112px 0 28px}
/* ---- story progress ribbon: rainbow rail plus 4 zones of 5 empty star slots ---- */
#qbar{display:none!important;position:absolute;left:14px;top:136px;bottom:calc(228px + env(safe-area-inset-bottom));width:76px;z-index:12;pointer-events:none;display:flex;flex-direction:column-reverse;justify-content:space-between}
.qrail{position:absolute;left:0;top:0;bottom:0;width:9px;border-radius:5px;background:#ffffffb8;border:2px solid #fff;overflow:hidden}
.qfill{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:50% 100%;transform:scaleY(0);background:linear-gradient(0deg,#ff5c8a,#ffa24a,#ffe55c,#7ee081,#6ec6ff,#b388ff);transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.qz{position:relative;display:flex;align-items:center;gap:3px;margin-left:14px}
.qz .chip{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-style:normal;filter:grayscale(1);opacity:.65;border:3px solid #ffd1ea;flex:0 0 auto}
.qz .chip.done{filter:none;opacity:1;border-color:#ffe14d}
.qs{display:flex;flex-direction:column-reverse}
.qsl{position:relative;width:18px;height:clamp(13px,2.6vh,19px);font-size:clamp(13px,2.4vh,18px);line-height:clamp(13px,2.6vh,19px);text-align:center;color:#fff;text-shadow:0 0 3px #7b2d9e,0 0 2px #7b2d9e}
.qsl::before{content:"\2606"}
.qsl.f::before{content:"\2605";color:#ffc800;text-shadow:0 0 5px #fff6}
.qsl.pop{animation:slotpop .6s}
@keyframes slotpop{0%{transform:scale(.4)}50%{transform:scale(2.2)}100%{transform:scale(1)}}
.qsl.pop::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px;border-radius:50%;background:radial-gradient(#fff,#ffe14d00 70%);animation:ringfade .6s forwards}
@keyframes ringfade{0%{transform:scale(.4);opacity:1}100%{transform:scale(2);opacity:0}}
.fstar{position:absolute;left:-22px;top:-22px;font-size:44px;pointer-events:none}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(98px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;z-index:30}
#dots{display:flex;justify-content:center}
.dot{width:88px;height:88px;position:relative;font-size:40px;flex:0 1 88px;min-width:72px}
.dot::before{content:"";position:absolute;top:14px;right:14px;bottom:14px;left:14px;border-radius:50%;background:#fff;border:4px solid #ffb6dc;z-index:-1}
.dot.cur::before{background:#ffe14d;border-color:#ff6fb5;transform:scale(1.2)}
.dot.cur{transform:translateY(-6px) scale(1.12)}
.dot .st{position:absolute;right:4px;top:0;width:30px;height:30px;border-radius:50%;border:3px dashed #c9a6e0;background:#ffffffc0;font-size:19px;line-height:24px;text-align:center}
.dot.got .st{border:3px solid #ffe14d;background:#fff}
.dot .st.pop{animation:slotpop .6s}
.dot.nx{animation:claspp 1s infinite}
.arrow{position:absolute;bottom:calc(110px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#ff8fc7,#b388ff);border:6px solid #fff;color:#fff;font-size:50px;z-index:30;box-shadow:0 6px 0 #7b4bd1}
#prev{left:22px}#nextp{right:22px}
#nextp.nx{animation:nxbounce 1s infinite}
#nextp.nx::after{content:"";position:absolute;left:-6px;right:-6px;top:-6px;bottom:-6px;border-radius:50%;border:6px solid #ffe14d;animation:nxring 1s infinite;pointer-events:none}
@keyframes nxbounce{0%,100%{transform:translateX(0) scale(1)}35%{transform:translateX(14px) scale(1.18)}60%{transform:translateX(-4px) scale(.96)}}
@keyframes nxring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
#scount{position:absolute;left:30px;top:138px;z-index:30;min-width:80px;text-align:center;background:#fff;border:4px solid #ffc800;border-radius:24px;padding:4px 10px;font-size:26px;font-weight:900;color:#d6246e;box-shadow:0 3px 0 #e0a800;pointer-events:none}
#scount.pop{animation:slotpop .6s}
#ribbon{position:absolute;top:0;left:26px;width:88px;height:132px;z-index:30;background:linear-gradient(#ff3f7f,#d6246e);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);transform-origin:50% 0;animation:rsway 3.4s ease-in-out infinite;font-size:38px;padding-top:12px}
@keyframes rsway{50%{transform:rotate(3deg)}}
/* ---------- page turn transitions ---------- */
.spread.tf-out,.spread.tf-in{z-index:3;transform-origin:0 50%}
.spread.tf-out{animation:tfout .95s cubic-bezier(.55,0,.3,1) forwards}
.spread.tf-in{animation:tfout .95s cubic-bezier(.55,0,.3,1) reverse both}
@keyframes tfout{0%{transform:rotateY(0)}14%{transform:rotateY(5deg)}70%{opacity:1}100%{transform:rotateY(-112deg);opacity:0}}
.spread.tc-out,.spread.tc-in{z-index:3;transform-origin:0 100%}
.spread.tc-out{animation:tcout .95s ease-in forwards}
.spread.tc-in{animation:tcout .95s ease-in reverse both}
@keyframes tcout{0%{transform:none}18%{transform:rotateZ(1.5deg)}100%{transform:translate(-10%,-8%) rotateY(-65deg) rotateX(16deg) rotateZ(-12deg) scale(.88);opacity:0}}
.spread.ts-out{animation:fadeo .5s .3s forwards}
.spread.ts-in{animation:fadei .5s .3s both}
.spread.tz-out{animation:fadeo .28s forwards}
.spread.tz-in{animation:fadei .28s both}
@keyframes fadeo{to{opacity:0}}
@keyframes fadei{from{opacity:0}}
.wipe{position:absolute;top:-10%;bottom:-10%;left:0;width:34%;z-index:6;pointer-events:none;background:linear-gradient(90deg,#fff0,#fff 28%,#ffe14d 50%,#ff8fc7 72%,#fff0);transform:skewX(-14deg) translateX(-110%);animation:wipe .95s ease-in-out forwards}
.wipe.rev{animation-direction:reverse;animation-fill-mode:both}
@keyframes wipe{to{transform:skewX(-14deg) translateX(320%)}}
/* ---------- ambient motion (transform and opacity only) ---------- */
body.lite .amb,body.lite .idl,body.lite .shim{display:none}
body.lite .idl{animation:none}
.tw{position:absolute;font-style:normal;opacity:.5;animation:twinkle 2.8s ease-in-out infinite}
.cloud{position:absolute;left:-260px;width:150px;height:48px;background:#fff;border-radius:48px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:62px;height:62px;left:24px;top:-30px}
.cloud::after{width:48px;height:48px;left:76px;top:-20px}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.fb{position:absolute;bottom:-120px;width:30px;height:38px;border-radius:50%;opacity:.3;animation:floatup linear infinite}
.fb::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:26px;background:#8883}
@keyframes floatup{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-55vh) rotate(6deg)}100%{transform:translateY(-120vh) rotate(-6deg)}}
.flg{position:absolute;top:0;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:50px solid;transform-origin:50% 0;animation:flagsway 2.2s ease-in-out infinite alternate}
@keyframes flagsway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.flagsvg{transform-box:fill-box;transform-origin:0 50%;animation:flagwave 1.6s ease-in-out infinite alternate}
@keyframes flagwave{from{transform:skewY(-8deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1.05)}}
.bm{position:absolute;top:-6%;width:22vmin;height:120%;background:linear-gradient(#fff9,#fff0);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);transform-origin:50% 0;animation:beam 4.5s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.eqb{position:absolute;bottom:0;width:6%;height:55%;border-radius:12px 12px 0 0;opacity:.35;transform-origin:50% 100%;animation:eq .7s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.sp5 .eqb{animation-play-state:paused}
.sp5.beaton .eqb{animation-play-state:running;opacity:.6}
.mnote{position:absolute;bottom:-60px;font-size:30px;color:#fff;animation:noteup linear infinite}
@keyframes noteup{0%{transform:translateY(0) rotate(-10deg);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) rotate(14deg);opacity:0}}
.crwn{position:absolute;font-size:30px;opacity:.4;animation:bob 3.4s ease-in-out infinite}
.sunb{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(#ffffff30 0 8deg,#fff0 8deg 20deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ringbg{position:absolute;left:50%;top:50%;width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;border-radius:50%;background:conic-gradient(#ff5c8a,#ffa24a,#ffe55c,#7ee081,#6ec6ff,#b388ff,#ff5c8a);opacity:.4;animation:spin 26s linear infinite}
.discoL{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;pointer-events:none}
.disco .discoL{animation:dsc 4.8s ease-in-out infinite}
@keyframes dsc{50%{opacity:.5}}
.hill{position:absolute;bottom:-18%;width:70%;height:40%;border-radius:50%;background:#7fd47a}
/* ---------- characters ---------- */
.ch{pointer-events:auto;position:relative;width:20vmin;width:clamp(100px,min(22vmin,calc((100vw - 250px)/var(--n,4))),250px);height:calc(var(--ph,600px)*.31);flex:0 0 auto;min-width:100px}
.ch.big{width:clamp(150px,min(40vmin,calc((100vw - 250px)/var(--n,1))),360px);height:calc(var(--ph,600px)*.35)}
.ch .ci,.pc .ci{height:calc(100% - 28px)}
.ch .idl,.pc .idl{height:100%}
.ch svg,.pc svg{width:100%;height:100%}
.ch.pre{visibility:hidden}
.ci{display:block;position:relative;transform-origin:50% 90%}
.ch .nm,.pc .nm{height:24px;line-height:24px;padding-top:0;padding-bottom:0}
.idl{display:block;transform-origin:50% 100%;animation:idle 3.2s ease-in-out infinite}
@keyframes idle{50%{transform:scale(1.025,.975)}}
.nm{display:block;margin:2px auto 0;font-size:clamp(16px,2.6vmin,24px);font-weight:900;color:#fff;background:#7b4bd1;border-radius:14px;padding:1px 10px;width:max-content;max-width:100%;position:relative}
/* entrances: each character arrives differently */

/* Sprunki loops (copied from Wayne's Sprunki set): tap Pinki or Oren to start or stop their loop */
var LOOPS={};
function getLoop(id){
  if(LOOPS[id])return LOOPS[id];
  var a=new Audio('assets/sprunki-'+id+'-loop.m4a');a.loop=true;a.preload='auto';a.bad=false;a.onerror=function(){a.bad=true};
  return LOOPS[id]=a;
}
function loopVol(){return muted?0:(ducked?.15:1)}
function setLoopVols(){for(var k in LOOPS)LOOPS[k].volume=loopVol()}
function loopsOn(){for(var k in LOOPS)if(!LOOPS[k].paused)return true;return false}
function stopLoops(){for(var k in LOOPS){try{LOOPS[k].pause();LOOPS[k].currentTime=0}catch(e){}}}
function toggleLoop(id){
  var a=getLoop(id);if(a.bad)return false;
  if(!a.paused){a.pause();syncPads();return true}
  var other=null;for(var k in LOOPS)if(k!==id&&!LOOPS[k].paused)other=LOOPS[k];
  a.volume=loopVol();
  var pr;try{pr=a.play()}catch(e){a.bad=true;return false}
  if(pr&&pr.catch)pr.catch(function(){a.bad=true;a.pause();syncPads()});
  if(other&&other.duration&&a.duration){try{a.currentTime=other.currentTime%a.duration}catch(e){}} /* keep the loops in step */
  syncPads();return true;
}

/* ---- warp: a reward swooshes (sparkle trail, scale curve) into its empty slot, which then fills with a pop ---- */
function warp(from,toEl,html,done,size){
  var x=from.x,y=from.y;
  var e=document.createElement('div');e.className='fstar';e.innerHTML=html;e.style.fontSize=(size||44)+'px';FX.appendChild(e);
  var T=LITE?500:760;
  function tgt(){var r=toEl.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}
  var fin=false;function finish(){if(fin)return;fin=true;e.remove();done()}
  /* the flight re-reads the slot position every frame so a page turn or a moving bar cannot send the star to the wrong slot */
  var t0=0,last=null,fr=0,t=tgt();
  SFX.warp();
  function ease(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2}
  function step(ts){
    if(fin)return;if(!t0)t0=ts;
    var p=Math.min(1,(ts-t0)/T);t=tgt();
    var ep=ease(p),mx=(x+t.x)/2+(t.y<y?-60:60),my=Math.min(y,t.y)-110;
    var px=(1-ep)*(1-ep)*x+2*(1-ep)*ep*mx+ep*ep*t.x,py=(1-ep)*(1-ep)*y+2*(1-ep)*ep*my+ep*ep*t.y;
    var sc=p<.42?.5+1.2*(p/.42):1.7-.9*((p-.42)/.58);
    e.style.opacity=Math.min(1,p*6);
    e.style.transform='translate('+px+'px,'+py+'px) scale('+sc+')';
    fr++;
    if(fr%2===0&&!LITE)addP({x:px+rnd(-6,6),y:py+rnd(-6,6),vx:rnd(-.5,.5),vy:rnd(.2,1),g:0,life:0,max:20,c:pick(['#ffe14d','#fff','#ff8fc7']),s:rnd(10,18),r:0,vr:.12,sh:'s'});
    if(p>=1)finish();else requestAnimationFrame(step);
  }
  e.style.opacity=0;e.style.transform='translate('+x+'px,'+y+'px) scale(.5)';
  requestAnimationFrame(step);
  setTimeout(finish,T+700); /* fallback if the animation frames never run */
}

function goPage(n){
  if(n<0||n>LASTP||n===S.page)return;
  if(turning){pending=n;return}
  var oldEl=PG&&PG.el,dir=n>S.page?1:-1;
  leavePage();S.tok++;
  var el=buildPage(n);S.page=n;updateNav();
  if(!oldEl){enterPage(n);return}
  turning=true;
  var kind=LITE?'fade':TR[(dir>0?n:n+1)%3],dur=LITE?300:950;
  el.style.pointerEvents='none';oldEl.style.pointerEvents='none';
  if(kind==='flip'||kind==='curl'){
    var pre=kind==='flip'?'tf':'tc';
    if(dir>0)oldEl.classList.add(pre+'-out');else el.classList.add(pre+'-in');
  }else if(kind==='sparkle'){
    oldEl.classList.add('ts-out');el.classList.add('ts-in');
    var w=document.createElement('div');w.className='wipe'+(dir<0?' rev':'');bookEl.appendChild(w);
    setTimeout(function(){w.remove()},dur+50);

var HINT={t:null,raf:0,hand:null,ring:null,target:null,x:0,y:0,lx:-1,ly:-1,start:0};

}
function hintTargets(){
  if(!PG)return[];
  var q=function(sel){return [].slice.call(PG.el.querySelectorAll(sel))};
  var list=q('.it:not(.dead),.cd:not(.lit),.cap:not(.open),.pad,.acc,.go:not(.hide),.gift:not(.open)');
  if(!list.length){var nx=$('#nextp');if(nx&&!nx.classList.contains('hide')&&nx.classList.contains('nx'))return[nx];list=q('.ch:not(.pre),.pm')}
  return list.filter(function(e){var r=e.getBoundingClientRect();return r.width>0&&r.bottom>0&&r.top<H&&r.right>0&&r.left<W});
}
function showHint(){
  HINT.t=null;
  if(S.page<0||turning||Q.busy||S.intro||document.hidden||!$('#cover').classList.contains('gone')){scheduleIdle(1500);return}
  var list=hintTargets();if(!list.length){scheduleIdle(3000);return}
  var fx=HINT.lx<0?W/2:HINT.lx,fy=HINT.ly<0?H/2:HINT.ly,best=null,bd=1e9;
  list.forEach(function(e){var r=e.getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-fx,r.top+r.height/2-fy);if(d<bd){bd=d;best=e}});
  HINT.target=best;HINT.start=performance.now();HINT.x=fx;HINT.y=fy;
  var rr=best.getBoundingClientRect(),sz=Math.max(rr.width,rr.height)+22;
  var ring=document.createElement('div');ring.className='hring';ring.style.width=ring.style.height=sz+'px';
  var hand=document.createElement('div');hand.className='hand';hand.innerHTML='<span class="hh">👆</span>';
  FX.appendChild(ring);FX.appendChild(hand);HINT.ring=ring;HINT.hand=hand;
  var tapped=0,lastTap=0,from={x:fx,y:fy};
  (function frame(now){
    var t=HINT.target;if(!t||!HINT.hand)return;
    if(!document.body.contains(t)||t.classList.contains('dead')){hideHint();scheduleIdle(1200);return}
    var r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,k=Math.min(1,(now-HINT.start)/800),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    var px=from.x+(cx-from.x)*e,py=from.y+(cy-from.y)*e;

    HINT.ring.style.transform='translate('+(cx-sz/2)+'px,'+(cy-sz/2)+'px)';
    if(k>=1&&now-lastTap>1300&&tapped<3){ /* the tap: finger presses, ripple hits the object */
      lastTap=now;tapped++;var hh=HINT.hand.firstChild;hh.classList.remove('press');void hh.offsetWidth;hh.classList.add('press');

    }
    if(tapped>=3&&now-lastTap>1300){hideHint();scheduleIdle(6000);return}
    HINT.raf=requestAnimationFrame(frame);
  })(performance.now());
}
