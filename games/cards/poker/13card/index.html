<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13 Card Poker - F.O.N.G. Card Engine</title>
    <link rel="stylesheet" href="ffa.css">
</head>
<body>
<script src="../../shared/card-nav.js"></script>
<script>CardNav.mount();</script>
    <header>
        <a class="btn btn-secondary" href="../index.html" style="text-decoration:none;display:inline-flex;align-items:center;">&larr; Back</a>
        <div class="header-title">13 CARD POKER</div>
        <div>You: <span id="myBal">100</span></div>
    </header>
    <main>
        <section class="controls" aria-label="Game options">
            <label>NPCs
                <select id="selNpc"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
            </label>
            <label>Ante
                <select id="selAnte"><option value="1">1</option><option value="2">2</option><option value="5">5</option></select>
            </label>
            <label><input type="checkbox" id="chkSkip"> Skip animations</label>
            <button class="btn btn-danger" id="btnReset" type="button">Reset bankrolls</button>
        </section>
        <div class="status-banner" id="banner" role="status">Pick your options, then tap Deal.</div>
        <section class="opps n3" id="opps" aria-label="Opponents"></section>
        <section class="detail" id="detail" hidden></section>
        <div class="table-mid"><div class="deck" id="deck" aria-hidden="true"></div></div>
        <section class="me" aria-label="Your hand">
            <div class="me-head">
                <div class="av" id="meAv"></div>
                <div>
                    <div class="nm">You</div>
                    <div><span class="coin"></span><span id="meBal">100</span> <span class="chg" id="meChg"></span></div>
                </div>
                <span class="chip" id="meChip">waiting</span>
            </div>
            <div class="rows-grid" id="rows">
                <div class="row-box" id="box-front"><div class="row-label">Front (3) <small id="ev-front">-</small></div><div class="row-cards" id="row-front"></div></div>
                <div class="row-box" id="box-mid"><div class="row-label">Middle (5) <small id="ev-mid">-</small></div><div class="row-cards" id="row-mid"></div></div>
                <div class="row-box" id="box-back"><div class="row-label">Back (5) <small id="ev-back">-</small></div><div class="row-cards" id="row-back"></div></div>
            </div>
        </section>
        <section class="settle" id="settle" hidden aria-live="polite"></section>
    </main>
    <footer>
        <button class="btn btn-primary" id="btnDeal" type="button">Deal</button>
        <button class="btn btn-secondary" id="btnAuto" type="button" hidden>Auto-arrange</button>
        <button class="btn btn-primary" id="btnLock" type="button" hidden>Lock</button>
    </footer>

    <script src="../../../../js/prefs.js"></script>
    <script src="../../shared/card-assets.js"></script>
    <script src="../../shared/card-anim.js"></script>
    <script src="ffa.js"></script>
    <script src="faces.js"></script>
    <script src="ffa-ui.js"></script>
</body>
</html>
