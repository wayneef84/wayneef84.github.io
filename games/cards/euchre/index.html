<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Euchre | Family Arcade</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body {
            height: 100%; overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at center, #1a472a 0%, #0d2818 100%);
            color: #fff;
        }
        .game-shell {
            display: flex; flex-direction: column; justify-content: space-between;
            height: 100%; max-width: 960px; margin: 0 auto; padding: 10px;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.45); padding: 8px 14px; border-radius: 10px;
            font-size: 0.9rem; gap: 10px; flex-wrap: wrap;
        }
        .score-box { display: flex; gap: 16px; font-weight: 700; }
        .score-us { color: #4ade80; }
        .score-them { color: #f87171; }
        .trump-badge {
            background: rgba(255, 215, 0, 0.18); border: 1px solid #ffd700;
            color: #ffd700; padding: 4px 10px; border-radius: 999px; font-weight: 700;
        }
        .table-area {
            flex: 1; display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 90px 1fr 90px;
            align-items: center; justify-items: center;
            gap: 6px; padding: 6px 0; position: relative;
        }
        .seat-top { grid-column: 2; grid-row: 1; text-align: center; }
        .seat-left { grid-column: 1; grid-row: 2; text-align: center; }
        .seat-right { grid-column: 3; grid-row: 2; text-align: center; }
        .center-trick {
            grid-column: 2; grid-row: 2;
            width: 100%; max-width: 360px; min-height: 160px;
            background: rgba(0, 0, 0, 0.25); border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 10px; gap: 8px;
        }
        .seat-label {
            font-size: 0.8rem; font-weight: 700; color: #cbd5e1;
            margin-bottom: 4px;
        }
        .seat-label.dealer::after {
            content: " (D)"; color: #ffd700;
        }
        .ai-count {
            font-size: 0.75rem; background: rgba(255,255,255,0.12);
            padding: 3px 8px; border-radius: 8px; display: inline-block;
        }
        .trick-cards {
            display: flex; gap: 8px; align-items: center; justify-content: center;
            flex-wrap: wrap; min-height: 96px;
        }
        .trick-slot {
            display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: #cbd5e1;
        }
        .trick-slot canvas, .kitty-box canvas {
            width: 60px; height: 84px; border-radius: 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.45);
        }
        .player-zone {
            grid-column: 1 / 4; grid-row: 3;
            display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;
        }
        .hand-row {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 104px;
        }
        .card-btn {
            background: none; border: 2px solid transparent; border-radius: 8px;
            padding: 0; cursor: pointer; transition: transform 0.15s, border-color 0.15s;
        }
        .card-btn canvas {
            width: 68px; height: 95px; border-radius: 6px; display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card-btn.playable:hover {
            transform: translateY(-8px); border-color: #ffd700;
        }
        .card-btn.disabled {
            opacity: 0.45; cursor: not-allowed;
        }
        .controls-bar {
            display: flex; gap: 8px; justify-content: center; align-items: center;
            flex-wrap: wrap; min-height: 44px; padding: 6px;
            background: rgba(0,0,0,0.4); border-radius: 10px;
        }
        .btn {
            padding: 8px 14px; border-radius: 8px; border: none;
            font-weight: 700; font-size: 0.85rem; cursor: pointer;
            background: #ffd700; color: #0f172a;
        }
        .btn-secondary { background: #334155; color: #f8fafc; }
        .status-msg {
            font-size: 0.9rem; font-weight: 600; color: #fef08a; text-align: center;
        }
    </style>
</head>
<body>
<div class="game-shell">
    <header>
        <div class="score-box">
            <span class="score-us">Us (You & Partner): <span id="scoreTeam1">0</span>/10</span>
            <span class="score-them">Them (West & East): <span id="scoreTeam2">0</span>/10</span>
        </div>
        <div class="trump-badge" id="trumpDisplay">Trump: —</div>
        <div style="font-size:0.8rem;color:#cbd5e1;">Tricks: Us <span id="tricksTeam1">0</span> | Them <span id="tricksTeam2">0</span></div>
    </header>

    <div class="table-area">
        <div class="seat-top">
            <div class="seat-label" id="label-p3">Partner (AI)</div>
            <div class="ai-count" id="count-p3">5 cards</div>
        </div>
        <div class="seat-left">
            <div class="seat-label" id="label-p2">West (AI)</div>
            <div class="ai-count" id="count-p2">5 cards</div>
        </div>
        <div class="center-trick">
            <div class="status-msg" id="statusMsg">Dealing Euchre...</div>
            <div class="kitty-box" id="kittyBox" style="display:none;text-align:center;">
                <div style="font-size:0.75rem;color:#cbd5e1;margin-bottom:4px;">Turn-Up Card</div>
                <div id="kittyCardSlot"></div>
            </div>
            <div class="trick-cards" id="trickArea"></div>
        </div>
        <div class="seat-right">
            <div class="seat-label" id="label-p4">East (AI)</div>
            <div class="ai-count" id="count-p4">5 cards</div>
        </div>

        <div class="player-zone">
            <div class="seat-label" id="label-p1">You</div>
            <div class="hand-row" id="playerHand"></div>
        </div>
    </div>

    <div class="controls-bar" id="controlsBar">
        <button class="btn" id="btnNewGame">New Match</button>
    </div>
</div>

<script src="../shared/enums.js"></script>
<script src="../shared/card.js"></script>
<script src="../shared/deck.js"></script>
<script src="../shared/pile.js"></script>
<script src="../shared/player.js"></script>
<script src="../shared/card-assets.js"></script>
<script src="../shared/engine.js"></script>
<script src="ruleset.js"></script>
<script>
(function() {
    CardAssets.init();
    var suitSymbols = { SPADES: '♠', HEARTS: '♥', DIAMONDS: '♦', CLUBS: '♣' };
    var engine = new GameEngine(EuchreRuleset);

    function startMatch() {
        EuchreRuleset._scores = { team1: 0, team2: 0 };
        EuchreRuleset._dealerIndex = 0;
        engine.init([
            { id: 'p1', name: 'You', type: 'human' },
            { id: 'p2', name: 'West', type: 'ai' },
            { id: 'p3', name: 'Partner', type: 'ai' },
            { id: 'p4', name: 'East', type: 'ai' }
        ]);
        startHand();
    }

    function startHand() {
        EuchreRuleset._trumpSuit = null;
        EuchreRuleset._trumpCaller = null;
        EuchreRuleset._currentTrick = [];
        EuchreRuleset._trickLeader = null;
        EuchreRuleset._tricksWon = { team1: 0, team2: 0 };
        EuchreRuleset._phase = 'dealing';
        EuchreRuleset._turnUpCard = null;
        for (var i = 0; i < engine.players.length; i++) {
            engine.players[i]._hasPassed = false;
            engine.players[i]._hasPassedSecond = false;
        }
        engine.startRound();
        renderAll();
    }

    function makeCardCanvas(card, faceUp) {
        var keys = card.getAssetKey();
        var src = faceUp ? CardAssets.getAsset(keys[0], keys[1]) : CardAssets.getAsset(null, null);
        var c = document.createElement('canvas');
        c.width = CardAssets.width;
        c.height = CardAssets.height;
        if (src) c.getContext('2d').drawImage(src, 0, 0);
        return c;
    }

    function renderAll(lastMessage) {
        var gs = engine.getGameState();
        document.getElementById('scoreTeam1').textContent = EuchreRuleset._scores.team1;
        document.getElementById('scoreTeam2').textContent = EuchreRuleset._scores.team2;
        document.getElementById('tricksTeam1').textContent = EuchreRuleset._tricksWon.team1;
        document.getElementById('tricksTeam2').textContent = EuchreRuleset._tricksWon.team2;

        var trumpText = EuchreRuleset._trumpSuit
            ? (EuchreRuleset._trumpSuit + ' ' + (suitSymbols[EuchreRuleset._trumpSuit] || ''))
            : 'Calling...';
        document.getElementById('trumpDisplay').textContent = 'Trump: ' + trumpText;

        ['p1', 'p2', 'p3', 'p4'].forEach(function(pid, idx) {
            var lbl = document.getElementById('label-' + pid);
            if (lbl) {
                lbl.className = 'seat-label' + (EuchreRuleset._dealerIndex === idx ? ' dealer' : '');
            }
            if (pid !== 'p1') {
                var p = gs.players[idx];
                document.getElementById('count-' + pid).textContent = (p ? p.hand.count : 0) + ' cards';
            }
        });

        // Kitty turn-up card during calling phase
        var kittyBox = document.getElementById('kittyBox');
        var kittySlot = document.getElementById('kittyCardSlot');
        kittySlot.innerHTML = '';
        if (EuchreRuleset._phase === 'calling' && EuchreRuleset._turnUpCard) {
            kittyBox.style.display = 'block';
            kittySlot.appendChild(makeCardCanvas(EuchreRuleset._turnUpCard, true));
        } else {
            kittyBox.style.display = 'none';
        }

        // Current trick cards
        var trickArea = document.getElementById('trickArea');
        trickArea.innerHTML = '';
        for (var t = 0; t < EuchreRuleset._currentTrick.length; t++) {
            var entry = EuchreRuleset._currentTrick[t];
            var slot = document.createElement('div');
            slot.className = 'trick-slot';
            slot.appendChild(makeCardCanvas(entry.card, true));
            var cap = document.createElement('span');
            cap.textContent = entry.playerId === 'p1' ? 'You' : entry.playerId.toUpperCase();
            slot.appendChild(cap);
            trickArea.appendChild(slot);
        }

        // Player hand
        var handEl = document.getElementById('playerHand');
        handEl.innerHTML = '';
        var p1 = gs.players[0];
        var isMyTurn = (gs.state === 'PLAYER_TURN' && gs.activeActorId === 'p1');
        var avail = isMyTurn ? EuchreRuleset.getAvailableActions(gs, 'p1') : [];

        if (p1) {
            for (var cIdx = 0; cIdx < p1.hand.contents.length; cIdx++) {
                var card = p1.hand.contents[cIdx];
                var btn = document.createElement('button');
                var canPlayThis = isMyTurn && EuchreRuleset._phase === 'playing' && avail.indexOf('playCard_' + cIdx) !== -1;
                btn.className = 'card-btn ' + (canPlayThis ? 'playable' : (EuchreRuleset._phase === 'playing' ? 'disabled' : ''));
                btn.appendChild(makeCardCanvas(card, true));
                if (canPlayThis) {
                    (function(indexToPlay) {
                        btn.onclick = function() {
                            engine.submitAction('p1', 'playCard_' + indexToPlay);
                        };
                    })(cIdx);
                }
                handEl.appendChild(btn);
            }
        }

        // Controls bar
        var bar = document.getElementById('controlsBar');
        bar.innerHTML = '';
        if (gs.state === 'GAME_OVER') {
            var matchOver = EuchreRuleset._scores.team1 >= 10 || EuchreRuleset._scores.team2 >= 10;
            var nextBtn = document.createElement('button');
            nextBtn.className = 'btn';
            nextBtn.textContent = matchOver ? 'Play New Match' : 'Deal Next Hand';
            nextBtn.onclick = function() {
                if (matchOver) {
                    startMatch();
                } else {
                    EuchreRuleset._dealerIndex = (EuchreRuleset._dealerIndex + 1) % 4;
                    startHand();
                }
            };
            bar.appendChild(nextBtn);
        } else if (isMyTurn && EuchreRuleset._phase === 'calling') {
            avail.forEach(function(act) {
                var b = document.createElement('button');
                b.className = act === 'pass' ? 'btn btn-secondary' : 'btn';
                if (act === 'orderUp') {
                    var s = EuchreRuleset._turnUpCard ? EuchreRuleset._turnUpCard.suit : '';
                    b.textContent = 'Order Up ' + s + ' ' + (suitSymbols[s] || '');
                } else if (act.indexOf('call_') === 0) {
                    var cs = act.replace('call_', '');
                    b.textContent = 'Call ' + cs + ' ' + (suitSymbols[cs] || '');
                } else {
                    b.textContent = 'Pass';
                }
                b.onclick = function() { engine.submitAction('p1', act); };
                bar.appendChild(b);
            });
        } else {
            var info = document.createElement('span');
            info.style.color = '#cbd5e1';
            info.style.fontSize = '0.85rem';
            info.textContent = isMyTurn ? 'Tap a highlighted card to play' : 'Waiting for AI players...';
            bar.appendChild(info);
        }

        if (lastMessage) {
            document.getElementById('statusMsg').textContent = lastMessage;
        }
    }

    engine.on('*', function(ev) {
        if (ev.type === 'MESSAGE') {
            renderAll(ev.text);
        } else if (ev.type === 'ROUND_WIN') {
            var res = ev.resolution || {};
            var msg = (res.winners && res.winners[0] === 'team1' ? 'Us' : 'Them') +
                      ' won the hand (+' + (res.points || 1) + ' pts)!';
            if (res.gameWinner) {
                msg = (res.gameWinner === 'team1' ? '🎉 You & Partner Win the Match!' : 'Opponent Team Wins the Match!');
            }
            renderAll(msg);
        } else if (ev.type === 'TURN_START' || ev.type === 'STATE_CHANGE') {
            renderAll();
        }
    });

    document.getElementById('btnNewGame').onclick = startMatch;
    startMatch();
})();
</script>
</body>
</html>
