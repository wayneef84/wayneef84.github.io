<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>S4K Mixer v2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="fx" class="fx" aria-hidden="true"></div>
    <div id="fog" class="fog" aria-hidden="true"></div>
    <div id="fade" class="fade" aria-hidden="true"></div>

    <header class="bar top">
        <a class="btn" href="../../index.html" id="homeBtn">&#127968; Home</a>
        <h1>S4K Mixer v2</h1>
        <button class="btn" id="helpBtn" type="button" aria-label="Help and keys">?</button>
    </header>

    <nav class="bar seasons" id="seasons" aria-label="Pick a season"></nav>

    <button id="exitHorror" class="exit-horror" type="button" hidden>&#9664; Exit spooky mode</button>

    <main class="stage-wrap">
        <div id="stage" class="stage" aria-label="Stage"></div>
    </main>

    <section class="bar controls" aria-label="Controls">
        <button class="btn primary" id="playBtn" type="button"><span class="ico">&#9208;</span><span class="lbl">Pause</span></button>
        <button class="btn" id="muteBtn" type="button" aria-pressed="false"><span class="ico">&#128266;</span><span class="lbl">Mute</span></button>
        <label class="vol"><span class="ico" aria-hidden="true">&#128265;</span>
            <input type="range" id="volRange" min="0" max="100" value="80" aria-label="Volume"></label>
        <button class="btn" id="undoBtn" type="button"><span class="ico">&#8630;</span><span class="lbl">Undo</span></button>
        <button class="btn" id="resetBtn" type="button"><span class="ico">&#128260;</span><span class="lbl">Reset</span></button>
        <button class="btn" id="saveBtn" type="button"><span class="ico">&#128190;</span><span class="lbl">Save</span></button>
        <button class="btn" id="loadBtn" type="button"><span class="ico">&#128194;</span><span class="lbl">Load</span></button>
        <span class="slots-ctl" aria-label="Number of spots">
            <button class="btn sq" id="slotMinus" type="button" aria-label="Fewer spots">&minus;</button>
            <span id="slotCount" class="slot-count" aria-live="polite">6</span>
            <button class="btn sq" id="slotPlus" type="button" aria-label="More spots">+</button>
        </span>
    </section>

    <section class="bar tray" aria-label="Characters">
        <div id="tabs" class="tabs" role="tablist"></div>
        <div id="tiles" class="tiles"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h2 id="modalTitle"></h2>
            <div id="modalBody"></div>
            <div id="modalBtns" class="modal-btns"></div>
        </div>
    </div>

    <script src="js/synth.js"></script>
    <script src="js/art.js"></script>
    <script src="js/audio-classic.js"></script>
    <!-- Season packs: add a new season by adding one file here. -->
    <script src="js/packs/classic.js"></script>
    <script src="js/packs/spring.js"></script>
    <script src="js/packs/summer.js"></script>
    <script src="js/packs/autumn.js"></script>
    <script src="js/packs/winter.js"></script>
    <script src="js/packs/halloween.js"></script>
    <script src="js/packs/aqua.js"></script>
    <script src="js/packs/toxic.js"></script>
    <script src="js/packs/robo.js"></script>
    <script src="js/packs/candy.js"></script>
    <script src="js/packs/bubblegum.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
