<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>F.O.N.G. Memory Match</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="bar top">
        <a class="btn" href="../../index.html" id="homeBtn" aria-label="Home">&#127968;<span class="lbl"> Home</span></a>
        <h1>Memory Match</h1>
        <div class="tools">
            <button class="btn" id="muteBtn" type="button" aria-pressed="false" aria-label="Sound on"><span class="ico">&#128266;</span></button>
            <button class="btn" id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">&#9881;&#65039;</button>
            <button class="btn" id="restartBtn" type="button" aria-label="Restart">&#128260;</button>
        </div>
    </header>

    <div class="status" id="status" aria-label="Game info">
        <span id="movesLbl">Moves: <b id="moves">0</b></span>
        <span id="timerLbl" hidden>Time: <b id="timer">0:00</b></span>
        <span id="bestLbl">Best: <b id="best">-</b></span>
        <button class="btn cheers-btn" id="cheersBtn" type="button" aria-label="Cheers settings for grown-ups">&#128266; Cheers</button>
    </div>

    <main class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="group" aria-label="Memory cards"></div>
    </main>

    <div class="live" id="live" role="status" aria-live="polite"></div>

    <section class="panel" id="settingsPanel" aria-label="Settings" hidden>
        <div class="card-box">
            <h2>Settings</h2>
            <div class="group" role="radiogroup" aria-label="Board size">
                <p class="gl">Size</p>
                <div class="choices" id="sizeChoices"></div>
            </div>
            <div class="group" role="radiogroup" aria-label="Card set">
                <p class="gl">Cards</p>
                <div class="choices" id="setChoices"></div>
            </div>
            <div class="group">
                <button class="btn wide" id="timerToggle" type="button" aria-pressed="false">&#9201;&#65039; Timer: Off</button>
            </div>
            <button class="btn primary wide" id="closeSettings" type="button">Done</button>
        </div>
    </section>

    <section class="panel" id="winPanel" aria-label="You won" hidden>
        <div class="card-box win">
            <h2>You found them all! &#127881;</h2>
            <p id="winText"></p>
            <p id="winBest" class="best-note"></p>
            <div class="row">
                <button class="btn primary" id="againBtn" type="button">Play again</button>
                <button class="btn" id="sizeBtn" type="button">Change size</button>
            </div>
        </div>
    </section>

    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

    <script src="../../js/cheer.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
