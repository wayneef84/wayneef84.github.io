<!DOCTYPE html>
<html lang="en" data-theme="pro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F.O.N.G. Arcade | Home</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#0f1117">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fong Arcade">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <script src="./js/theme/loader.js"></script>
    <link rel="stylesheet" href="./css/components/global.css">
    <link rel="stylesheet" href="./css/components/card.css">
    <link rel="stylesheet" href="./css/skins/classic.css">
    <link rel="stylesheet" href="./css/skins/print-shop.css">
    <link rel="stylesheet" href="./css/skins/cabinet.css">
    <link rel="stylesheet" href="./css/skins/control-panel.css">
    <link rel="stylesheet" href="./css/skins/metro-map.css">
    <link rel="stylesheet" href="./css/skins/handheld.css">
    <link rel="stylesheet" href="./css/skins/scrapbook.css">
    <link rel="stylesheet" href="./css/theme-overrides.css">
    <link rel="stylesheet" href="./css/theme-panel.css">
</head>
<body>

    <header class="global-nav">
        <a href="./index.html" class="nav-brand">F.O.N.G. ARCADE</a>
        <div class="nav-right">
            <div id="global-play-count" class="stats-container">Plays: 0</div>
            <button type="button" id="theme-open" class="theme-open" aria-haspopup="dialog" aria-label="Customize this page"><span aria-hidden="true">&#9881;</span><span class="theme-open-label">Customize</span></button>
            <a href="?mode=fun" id="theme-toggle" class="theme-toggle-link">&#127918; Fun Mode</a>
        </div>
    </header>

    <main>
        <!-- Install app button or iOS hint. Filled by js/pwa.js, hidden unless installable -->
        <div id="pwa-install" hidden></div>

        <!-- Just added: big cards for catalog entries with spotlight: true -->
        <section class="just-added" id="just-added" aria-label="Just added" hidden></section>

        <!-- Featured Apps — Card Games + MD Reader -->
        <section class="featured-apps" id="featured-apps" aria-label="Featured applications"></section>

        <!-- Search across every game and tool -->
        <section class="home-search" aria-label="Search">
            <input type="search" id="home-search" class="hub-search" placeholder="Search all games and tools" aria-label="Search all games and tools" autocomplete="off">
            <div id="new-strip" class="new-strip"></div>
        </section>
        <section class="search-results" id="search-results" aria-live="polite" hidden></section>

        <!-- Groups: Games, Tools, Whiteout Survival, More (built from js/catalog.js) -->
        <div id="home-groups">
            <noscript>
                <section class="nav-section"><div class="nav-grid">
                    <a class="nav-card" href="./browse/index.html?group=games">Games</a>
                    <a class="nav-card" href="./browse/index.html?group=tools">Tools</a>
                    <a class="nav-card" href="./browse/index.html?group=wos">Whiteout Survival</a>
                    <a class="nav-card" href="./browse/index.html?group=more">More</a>
                </div></section>
            </noscript>
        </div>
    </main>

    <footer class="landing-footer">
        <a href="./browse/index.html?group=more" class="footer-link">More</a>
        <span class="footer-sep">&middot;</span>
        <a href="./profile/" class="footer-link">Developer Profile</a>
        <span class="footer-sep">&middot;</span>
        <span class="footer-copy">&copy; 2025&ndash;2026 F.O.N.G.</span>
    </footer>

    <script src="./js/catalog.js"></script>
    <script src="./js/player-stats.js"></script>
    <script src="./js/theme/palettes.js"></script>
    <script src="./js/theme/validate.js"></script>
    <script src="./js/theme/apply.js"></script>
    <script src="./js/hub-data.js"></script>
    <script src="./js/hub-nav.js"></script>
    <script src="./js/hub-filters.js"></script>
    <script src="./js/theme/panel.js"></script>
    <script src="./js/pwa.js" data-install="1"></script>
    <script>if (window.FongStats) { window.FongStats.trackClicks(); }</script>
</body>
</html>
